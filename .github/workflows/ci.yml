name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Debug
            rpc: "ON"
          - name: GCC Release without RPC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Release
            rpc: "OFF"
          - name: Clang Release
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            build_type: Release
            rpc: "ON"
          - name: Apple Clang Release
            os: macos-14
            cc: clang
            cxx: clang++
            build_type: Release
            rpc: "ON"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DUTREEXO_BUILD_RPC=${{ matrix.rpc }}
          -DUTREEXO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + LSan + UBSan
            sanitizers: address,undefined
          - name: TSan
            sanitizers: thread
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:report_error_type=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reduce address-space randomization for TSan
        if: matrix.sanitizers == 'thread'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DUTREEXO_SANITIZERS=${{ matrix.sanitizers }}
          -DUTREEXO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: Clang-Tidy and source lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install analysis tools
        run: bash tools/ci-install-packages.sh clang-tidy shellcheck
      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run Clang-Tidy
        run: run-clang-tidy -j 1 -p build -quiet '.*/(src|test|bench)/.*\.cpp$'
      - name: Check shell scripts
        run: shellcheck tools/*.sh test/*.sh
      - name: Check Python syntax
        run: python3 -m compileall -q test tools
      - name: Check release checkpoint metadata
        run: python3 tools/verify-checkpoint-manifest.py
      - name: Test release checkpoint download verifier
        run: python3 test/verify_checkpoint_download_tests.py
      - name: Test AssumeUtreexo snapshot exporter
        run: python3 test/export_assumeutreexo_tests.py
      - name: Check whitespace
        run: git diff --check

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Valgrind
        run: bash tools/ci-install-packages.sh valgrind
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Check accumulator tests
        run: >-
          valgrind --error-exitcode=1 --leak-check=full
          --fair-sched=yes
          --show-leak-kinds=all --errors-for-leak-kinds=definite,possible
          ./build/utreexo_tests
      - name: Check RPC tests
        run: >-
          valgrind --error-exitcode=1 --leak-check=full
          --fair-sched=yes
          --show-leak-kinds=all --errors-for-leak-kinds=definite,possible
          ./build/utreexo_rpc_tests

  fuzz:
    name: libFuzzer smoke test
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure fuzz targets
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DUTREEXO_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF
      - name: Build fuzz targets
        run: >-
          cmake --build build --parallel 2 --target
          utreexo_fuzz_forest utreexo_fuzz_rpc_json utreexo_fuzz_p2p utreexo_fuzz_transaction_wire
      - name: Fuzz forest deserialization
        run: ./build/utreexo_fuzz_forest -runs=10000 -max_len=65536
      - name: Fuzz verbose RPC JSON parsing
        run: ./build/utreexo_fuzz_rpc_json -runs=10000 -max_len=65536
      - name: Fuzz P2P envelopes and getuproof requests
        run: ./build/utreexo_fuzz_p2p -runs=10000 -max_len=131072
      - name: Seed transaction codec from pinned utreexod vectors
        run: python3 test/integration/utreexod_tx_fuzz_seeds.py build/tx-corpus
      - name: Fuzz transaction proof codec
        run: ./build/utreexo_fuzz_transaction_wire build/tx-corpus -runs=10000 -max_len=131072

  utreexod-transaction-wire:
    name: Core 31.1 / compact utreexod v0.6 proof peers and transaction relay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UTREEXOD_COMMIT: fe71f3d9282ef0812f7f6087f0c0df9ce0fda508
      GOTOOLCHAIN: local
      CORE_VERSION: "31.1"
      CORE_ARCHIVE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: false
      - name: Clone pinned utreexod
        working-directory: ${{ runner.temp }}
        run: |
          git clone --filter=blob:none https://github.com/utreexo/utreexod utreexod-tx
          git -C utreexod-tx checkout --detach "${UTREEXOD_COMMIT}"
          test "$(git -C utreexod-tx rev-parse HEAD)" = "${UTREEXOD_COMMIT}"
      - name: Verify fixtures with the pinned Go encoder and decoder
        working-directory: ${{ runner.temp }}/utreexod-tx
        run: |
          go test -mod=readonly ./wire ./chaincfg/chainhash
          go run -mod=readonly "${GITHUB_WORKSPACE}/test/integration/utreexod_tx_vectors.go" \
            -check "${GITHUB_WORKSPACE}/test/data/utreexod_tx_vectors.h"
      - name: Build sidecar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUTREEXO_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
      - name: Apply and test the compact-node compatibility patch
        working-directory: ${{ runner.temp }}/utreexod-tx
        run: |
          git apply --check --whitespace=error-all "${GITHUB_WORKSPACE}/contrib/utreexod-v0.6.0-core-relay.patch"
          git apply "${GITHUB_WORKSPACE}/contrib/utreexod-v0.6.0-core-relay.patch"
          go test -mod=readonly . ./blockchain ./netsync ./mining ./mempool ./wire
          go build -mod=readonly -o "${GITHUB_WORKSPACE}/build/utreexod-relay" .
      - name: Install verified Bitcoin Core 31.1
        working-directory: ${{ runner.temp }}
        run: |
          archive="bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/${archive}"
          echo "${CORE_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "${archive}"
      - name: Verify transaction relay, proof rejection, recovery, and mining
        run: >-
          python3 test/integration/core_utreexod_relay.py
          --core="${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin/bitcoind"
          --sidecar="${GITHUB_WORKSPACE}/build/utreexo-bridge"
          --utreexod="${GITHUB_WORKSPACE}/build/utreexod-relay"
          --work-dir="${RUNNER_TEMP}/core-utreexod-relay"
          --timeout=180
      - name: Verify automatic proof providers and independent block downloads
        run: >-
          python3 test/integration/core_utreexod_proof_peers.py
          --core="${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin/bitcoind"
          --sidecar="${GITHUB_WORKSPACE}/build/utreexo-bridge"
          --utreexod="${GITHUB_WORKSPACE}/build/utreexod-relay"
          --work-dir="${RUNNER_TEMP}/core-utreexod-proof-peers"
          --timeout=180
      - name: Verify address gossip and automatic compact-node discovery
        run: >-
          python3 test/integration/core_utreexod_discovery.py
          --core="${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin/bitcoind"
          --sidecar="${GITHUB_WORKSPACE}/build/utreexo-bridge"
          --utreexod="${GITHUB_WORKSPACE}/build/utreexod-relay"
          --work-dir="${RUNNER_TEMP}/core-utreexod-discovery"
          --timeout=180
      - name: Verify snapshot export, compact bootstrap, and restart
        run: >-
          python3 test/integration/core_utreexod_snapshot.py
          --core="${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin/bitcoind"
          --sidecar="${GITHUB_WORKSPACE}/build/utreexo-bridge"
          --utreexod="${GITHUB_WORKSPACE}/build/utreexod-relay"
          --work-dir="${RUNNER_TEMP}/core-utreexod-snapshot"
          --timeout=180
      - name: Report integration evidence
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/core-utreexod-snapshot/result.json"; then
            cat "${RUNNER_TEMP}/core-utreexod-snapshot/result.json"
          else
            tail -n 100 "${RUNNER_TEMP}/core-utreexod-snapshot/"*.log || true
          fi
          if test -f "${RUNNER_TEMP}/core-utreexod-relay/result.json"; then
            cat "${RUNNER_TEMP}/core-utreexod-relay/result.json"
          else
            tail -n 100 "${RUNNER_TEMP}/core-utreexod-relay/"*.log || true
          fi
          if test -f "${RUNNER_TEMP}/core-utreexod-proof-peers/result.json"; then
            cat "${RUNNER_TEMP}/core-utreexod-proof-peers/result.json"
          else
            tail -n 100 "${RUNNER_TEMP}/core-utreexod-proof-peers/"*.log || true
          fi
          if test -f "${RUNNER_TEMP}/core-utreexod-discovery/result.json"; then
            cat "${RUNNER_TEMP}/core-utreexod-discovery/result.json"
          else
            tail -n 100 "${RUNNER_TEMP}/core-utreexod-discovery/"*.log || true
          fi

  differential-regtest:
    name: Bitcoin Core / reference bridge / Floresta regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CORE_VERSION: "31.1"
      CORE_ARCHIVE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
      REFERENCE_COMMIT: 9582853345839d625e80ef46b1a23b6dd0fef6c6
      FLORESTA_COMMIT: bc2db8d07e72651f9981ce589c5688f4d575dc7a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Floresta build dependencies
        run: bash tools/ci-install-packages.sh libboost-dev
      - name: Build sidecar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Install verified Bitcoin Core binary
        working-directory: ${{ runner.temp }}
        run: |
          archive="bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          base="https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base}/${archive}"
          echo "${CORE_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "${archive}"
          echo "${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Build pinned reference bridge
        working-directory: ${{ runner.temp }}
        run: |
          git clone --filter=blob:none https://github.com/getfloresta/rpc-utreexo-bridge reference-bridge
          git -C reference-bridge checkout --detach "${REFERENCE_COMMIT}"
          cargo build --manifest-path reference-bridge/Cargo.toml --release --locked
      - name: Build pinned Floresta
        working-directory: ${{ runner.temp }}
        run: |
          git clone --filter=blob:none https://github.com/getfloresta/Floresta floresta
          git -C floresta checkout --detach "${FLORESTA_COMMIT}"
          cargo build --manifest-path floresta/Cargo.toml --release --locked -p florestad
      - name: Run differential regtest
        run: >-
          python3 test/integration/floresta_regtest.py
          --bitcoind="${RUNNER_TEMP}/bitcoin-${CORE_VERSION}/bin/bitcoind"
          --sidecar="${GITHUB_WORKSPACE}/build/utreexo-bridge"
          --reference-bridge="${RUNNER_TEMP}/reference-bridge/target/release/bridge"
          --florestad="${RUNNER_TEMP}/floresta/target/release/florestad"
          --timeout=300

  current-floresta-wire:
    name: Current Floresta getuproof/uproof compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLORESTA_COMMIT: bc2db8d07e72651f9981ce589c5688f4d575dc7a
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Clone pinned current Floresta
        working-directory: ${{ runner.temp }}
        run: |
          git clone --filter=blob:none https://github.com/getfloresta/Floresta floresta-current
          git -C floresta-current checkout --detach "${FLORESTA_COMMIT}"
      - name: Install sidecar wire compatibility test
        run: |
          mkdir -p "${RUNNER_TEMP}/floresta-current/crates/floresta-wire/tests"
          cp test/integration/floresta_wire_compat.rs \
            "${RUNNER_TEMP}/floresta-current/crates/floresta-wire/tests/sidecar_compat.rs"
      - name: Decode sidecar vectors with current Floresta
        working-directory: ${{ runner.temp }}/floresta-current
        run: cargo test --release --locked -p floresta-wire --test sidecar_compat
